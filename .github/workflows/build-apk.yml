name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Capacitor
        run: |
          mkdir -p www
          cp index.html www/ || true
          cp manifest.json www/ || true
          cp icon.png www/ || true
          cp icon.svg www/ || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "SyriaCash" "net.syriacash.app" --web-dir=www
          npx cap add android

      - name: Fix Kotlin Conflict
        run: |
          sed -i "s|dependencies {|dependencies {\n    implementation(platform('org.jetbrains.kotlin:kotlin-bom:1.8.22'))\n|" android/app/build.gradle
          cat android/app/build.gradle | head -50

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: syria-cash-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
